<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbdefb"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>

  <!-- Fluffy Cloud Base -->
  <path d="M3 9 Q1 9 1 7 Q1 5 3 5 Q4 4 5.5 4.5 Q7 4 8 5 Q9 5 9 7 Q9 9 7 9 Q6 10 5 9.5 Q4 10 3 9 Z" 
        fill="url(#sky)"/>
  <circle cx="2.5" cy="6.5" r="1.8" fill="#bbdefb"/>
  <circle cx="5" cy="5.8" r="2.2" fill="#e3f2fd"/>
  <circle cx="7.5" cy="6.5" r="1.8" fill="#bbdefb"/>

  <!-- Magnifying Glass Lens -->
  <circle cx="8" cy="8" r="3.2" fill="url(#lens)" stroke="#ffffff" stroke-width="0.6"/>

  <!-- Lightning Bolt Inside Lens -->
  <path d="M7.3 6.8 L7.8 7.8 L7.6 7.5 L8.1 8.5 L7.7 8.2 L8.2 9.2" 
        fill="none" stroke="#0288d1" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Handle -->
  <line x1="10.2" y1="10.2" x2="12.5" y2="12.5" stroke="#81d4fa" stroke-width="1.2" stroke-linecap="round"/>
</svg>